<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.1s; /* Плавный переход фона */
        }
        .container {
            background: #252538;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: opacity 0.2s; /* Плавное исчезновение блока */
        }
        .question-box {
            display: none;
        }
        .question-box.active {
            display: block;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        button, input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        button {
            background-color: #6c5ce7;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #5b4bc4;
        }
        input[type="text"] {
            background: #33334d;
            color: white;
            border: 1px solid #444466;
            box-sizing: border-box;
        }
        .options {
            text-align: left;
            margin-top: 15px;
        }
        .options label {
            display: block;
            background: #33334d;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .options label:hover {
            background: #3f3f63;
        }
        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- Вопрос 1: Имя -->
    <div class="question-box active" id="q1">
        <h2>Как вас зовут?</h2>
        <div class="options">
            <label><input type="radio" name="name" value="назар"> Назар</label>
        </div>
        <button onclick="checkRadio('name', 'назар', 'q2')">Далее</button>
    </div>

    <!-- Вопрос 2: Фамилия -->
    <div class="question-box" id="q2">
        <h2>Ваша фамилия?</h2>
        <div class="options">
            <label><input type="radio" name="surname" value="проскурня"> Проскурня</label>
        </div>
        <button onclick="checkRadio('surname', 'проскурня', 'q3')">Далее</button>
    </div>

    <!-- Вопрос 3: Отчество -->
    <div class="question-box" id="q3">
        <h2>Ваше отчество?</h2>
        <div class="options">
            <label><input type="radio" name="patronymic" value="иванович"> Иванович</label>
        </div>
        <button onclick="checkRadio('patronymic', 'иванович', 'q4')">Далее</button>
    </div>

    <!-- Вопрос 4: Возраст -->
    <div class="question-box" id="q4">
        <h2>Ваш возраст?</h2>
        <div class="options">
            <label><input type="radio" name="age" value="15"> 15</label>
        </div>
        <button onclick="checkRadio('age', '15', 'q5')">Далее</button>
    </div>

    <!-- Вопрос 5: Лучший друг -->
    <div class="question-box" id="q5">
        <h2>Кто ваш лучший друг?</h2>
        <div class="options">
            <label><input type="radio" name="friend" value="динозавр"> Динозавр</label>
        </div>
        <button onclick="checkRadio('friend', 'динозавр', 'q6')">Далее</button>
    </div>

    <!-- Вопрос 6: Любимая игра (ИЗМЕНЕНО) -->
    <div class="question-box" id="q6">
        <h2>Ваша любимая игра?</h2>
        <div class="options">
            <label><input type="radio" name="game" value="чикен ган"> Чикен Ган</label>
            <label><input type="radio" name="game" value="standoff 2"> Standoff 2</label>
            <label><input type="radio" name="game" value="brawl stars"> Brawl Stars</label>
            <label><input type="radio" name="game" value="роблокс"> Роблокс</label>
        </div>
        <!-- Теперь кнопка вызывает функцию белого экрана и перехода -->
        <button onclick="triggerWhiteFlash('q7')">Далее</button>
    </div>

    <!-- Вопрос 7: Имя брата -->
    <div class="question-box" id="q7">
        <h2>Имя вашего брата?</h2>
        <div class="options">
            <label><input type="radio" name="brother" value="тарас"> Тарас</label>
        </div>
        <button onclick="checkRadio('brother', 'тарас', 'q8')">Далее</button>
    </div>

    <!-- Вопрос 8: Устранить динозавра -->
    <div class="question-box" id="q8">
        <h2>Вы хотите устранить динозавра?</h2>
        <div class="options">
            <label><input type="radio" name="eliminate" value="да"> Да</label>
        </div>
        <button onclick="checkRadio('eliminate', 'да', 'q9')">Далее</button>
    </div>

    <!-- Вопрос 9: Корень из 625 -->
    <div class="question-box" id="q9">
        <h2>√625?</h2>
        <input type="text" id="ans9" placeholder="Введите ответ...">
        <button onclick="nextStep('q10')">Далее</button>
    </div>

    <!-- Вопрос 10: Предыдущий ответ + 42 -->
    <div class="question-box" id="q10">
        <h2>+42?</h2>
        <input type="text" id="ans10" placeholder="Введите ответ...">
        <button onclick="nextStep('q11')">Далее</button>
    </div>

    <!-- Вопрос 11: Финал (душа) -->
    <div class="question-box" id="q11">
        <h2>Вы готовы продать свою душу чикен гану?</h2>
        <div class="options">
            <label><input type="radio" name="soul" value="да"> Да</label>
        </div>
        <button onclick="nextStep('q12')">Отправить</button>
    </div>

    <!-- Вопрос 12: Последний вопрос с картинкой -->
    <div class="question-box" id="q12">
        <img src="image.png" alt="Фото" class="question-image">
        <h2>Это вы?</h2>
        <div class="options">
            <label><input type="radio" name="final" onclick="return false;"> Да</label>
            <label><input type="radio" name="final" onclick="return false;"> Нет</label>
        </div>
    </div>
</div>

<script>
    // Функция для вопросов с проверкой правильного ответа (как раньше)
    function checkRadio(groupName, correctValue, nextId) {
        const selected = document.querySelector(`input[name="${groupName}"]:checked`);
        const currentBoxElement = document.querySelector('.question-box.active');

        if (selected && selected.value.toLowerCase() === correctValue) {
            currentBoxElement.classList.remove('active');
            document.getElementById(nextId).classList.add('active');
        }
    }

    // Новая функция для перехода к следующему шагу без проверки ответа (для вопросов с инпутами)
    function nextStep(nextId) {
        const currentBoxElement = document.querySelector('.question-box.active');
        currentBoxElement.classList.remove('active');
        document.getElementById(nextId).classList.add('active');
    }

    // Новая функция для эффекта мигания и перехода в вопросе про игру
    function triggerWhiteFlash(nextId) {
        const container = document.getElementById('mainContainer');
        const currentBoxElement = document.querySelector('.question-box.active');

        // 1. Прячем текущий блок с вопросом
        container.style.opacity = '0';

        setTimeout(() => {
            // 2. Вспышка черного, затем белого фона
            document.body.style.background = '#000000';
            setTimeout(() => {
                document.body.style.background = '#ffffff'; // Белый экран
                
                // 3. Держим белый экран 0.5 секунды (500мс)
                setTimeout(() => {
                    // 4. Возвращаем фон
                    document.body.style.background = '#1e1e2f';
                    
                    // 5. Переходим к следующему вопросу
                    currentBoxElement.classList.remove('active');
                    document.getElementById(nextId).classList.add('active');
                    
                    // 6. Плавно возвращаем видимость контейнера
                    container.style.opacity = '1';
                }, 500);
            }, 80);
        }, 200);
    }
</script>

</body>
</html>
