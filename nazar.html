<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.1s;
            position: relative;
        }
        .container {
            background: #252538;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: opacity 0.2s;
        }
        .question-box {
            display: none;
        }
        .question-box.active {
            display: block;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        button, input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #6c5ce7;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #5b4bc4;
        }
        input[type="text"] {
            background: #33334d;
            color: white;
            border: 1px solid #444466;
        }
        .options {
            text-align: left;
            margin-top: 15px;
        }
        .options label {
            display: block;
            background: #33334d;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .options label:hover {
            background: #3f3f63;
        }
        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        /* Маленькая аккуратная кнопка точно в правом нижнем углу экрана */
        .page-secret-skip {
            display: none; /* Скрыта по умолчанию */
            position: fixed;
            right: 15px;
            bottom: 15px;
            width: auto;
            background: #2d2d44;
            color: #9999bb;
            border: 1px solid #444466;
            border-radius: 4px;
            font-size: 10px;
            padding: 4px 8px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s;
        }
        .page-secret-skip:hover {
            background: #3d3d5c;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- Вопрос 1: Имя -->
    <div class="question-box active" id="q1" data-title="1. Как вас зовут?">
        <h2>Как вас зовут?</h2>
        <div class="options">
            <label><input type="radio" name="name" value="назар"> Назар</label>
        </div>
        <button onclick="checkRadio('name', 'назар', 'q2')">Далее</button>
    </div>

    <!-- Вопрос 2: Фамилия -->
    <div class="question-box" id="q2" data-title="2. Ваша фамилия?">
        <h2>Ваша фамилия?</h2>
        <div class="options">
            <label><input type="radio" name="surname" value="проскурня"> Проскурня</label>
        </div>
        <button onclick="checkRadio('surname', 'проскурня', 'q3')">Далее</button>
    </div>

    <!-- Вопрос 3: Отчество -->
    <div class="question-box" id="q3" data-title="3. Ваше отчество?">
        <h2>Ваше отчество?</h2>
        <div class="options">
            <label><input type="radio" name="patronymic" value="иванович"> Иванович</label>
        </div>
        <button onclick="checkRadio('patronymic', 'иванович', 'q4')">Далее</button>
    </div>

    <!-- Вопрос 4: Возраст -->
    <div class="question-box" id="q4" data-title="4. Ваш возраст?">
        <h2>Ваш возраст?</h2>
        <div class="options">
            <label><input type="radio" name="age" value="15"> 15</label>
        </div>
        <button onclick="checkRadio('age', '15', 'q5')">Далее</button>
    </div>

    <!-- Вопрос 5: Лучший друг -->
    <div class="question-box" id="q5" data-title="5. Лучший друг">
        <h2>Кто ваш лучший друг?</h2>
        <div class="options">
            <label><input type="radio" name="friend" value="динозавр"> Динозавр</label>
        </div>
        <button onclick="checkRadio('friend', 'динозавр', 'q6')">Далее</button>
    </div>

    <!-- Вопрос 6: Любимая игра -->
    <div class="question-box" id="q6" data-title="6. Любимая игра">
        <h2>Ваша любимая игра?</h2>
        <div class="options">
            <label><input type="radio" name="game" value="чикен ган"> Чикен Ган</label>
            <label><input type="radio" name="game" value="standoff 2"> Standoff 2</label>
            <label><input type="radio" name="game" value="brawl stars"> Brawl Stars</label>
            <label><input type="radio" name="game" value="роблокс"> Роблокс</label>
        </div>
        <button onclick="checkGameSelection()">Далее</button>
    </div>

    <!-- Вопрос 7: Имя брата -->
    <div class="question-box" id="q7" data-title="7. Имя брата">
        <h2>Имя вашего брата?</h2>
        <div class="options">
            <label><input type="radio" name="brother" value="тарас"> Тарас</label>
        </div>
        <button onclick="checkRadio('brother', 'тарас', 'q8')">Далее</button>
    </div>

    <!-- Вопрос 8: Устранить динозавра -->
    <div class="question-box" id="q8" data-title="8. Устранить динозавра">
        <h2>Вы хотите устранить динозавра?</h2>
        <div class="options">
            <label><input type="radio" name="eliminate" value="да"> Да</label>
        </div>
        <button onclick="checkRadio('eliminate', 'да', 'q9')">Далее</button>
    </div>

    <!-- Вопрос 9: Корень из 625 -->
    <div class="question-box" id="q9" data-title="9. Корень из 625">
        <h2>√625?</h2>
        <input type="text" id="ans9" placeholder="Введите ответ...">
        <button onclick="checkMath('ans9', '25', 'q10')">Далее</button>
    </div>

    <!-- Вопрос 10: +42 -->
    <div class="question-box" id="q10" data-title="10. +42">
        <h2>+42?</h2>
        <input type="text" id="ans10" placeholder="Введите ответ...">
        <button onclick="checkMath('ans10', '67', 'q11')">Далее</button>
    </div>

    <!-- Вопрос 11: Продать душу -->
    <div class="question-box" id="q11" data-title="11. Продать душу">
        <h2>Вы готовы продать свою душу чикен гану?</h2>
        <div class="options">
            <label><input type="radio" name="soul" value="да"> Да</label>
        </div>
        <button onclick="checkRadio('soul', 'да', 'q12')">Отправить</button>
    </div>

    <!-- Вопрос 12: Кто срал монетой? -->
    <div class="question-box" id="q12" data-title="12. Кто срал монетой">
        <h2>Кто срал монетой?</h2>
        <input type="text" id="ansCoin" placeholder="Введите ответ...">
        <button onclick="checkNotEmpty('ansCoin', 'q13')">Далее</button>
    </div>

    <!-- Вопрос 13: Последний вопрос -->
    <div class="question-box" id="q13" data-title="13. Финал (Это вы?)">
        <img src="image.png" alt="Фото" class="question-image">
        <h2>Это вы?</h2>
        <div class="options">
            <label><input type="radio" name="final" value="Да"> Да</label>
            <label><input type="radio" name="final" value="Да"> Да</label>
        </div>
    </div>
</div>

<!-- Маленькая кнопка в углу экрана (только на 9 и 10 вопросах) -->
<button id="globalSkipBtn" class="page-secret-skip" onclick="skipCurrentMath()">я гей</button>

<script>
    // Функция отправки данных в админку
    function saveProgress(questionId, answerText) {
        const box = document.getElementById(questionId);
        const qTitle = box ? box.getAttribute('data-title') : questionId;
        
        localStorage.setItem('admin_current_question', qTitle);
        
        let answers = JSON.parse(localStorage.getItem('admin_user_answers') || '{}');
        answers[qTitle] = answerText;
        localStorage.setItem('admin_user_answers', JSON.stringify(answers));
    }

    // Инициализация при загрузке первого вопроса
    window.onload = function() {
        saveProgress('q1', 'Начало опроса');
        updateGlobalButton();
    };

    function updateGlobalButton() {
        const activeBox = document.querySelector('.question-box.active');
        const globalBtn = document.getElementById('globalSkipBtn');
        
        if (activeBox && (activeBox.id === 'q9' || activeBox.id === 'q10')) {
            globalBtn.style.display = 'block';
        } else {
            globalBtn.style.display = 'none';
        }
    }

    function skipCurrentMath() {
        const activeBox = document.querySelector('.question-box.active');
        if (activeBox.id === 'q9') {
            saveProgress('q9', 'Пропущено (кнопка)');
            nextStep('q10');
        } else if (activeBox.id === 'q10') {
            saveProgress('q10', 'Пропущено (кнопка)');
            nextStep('q11');
        }
    }

    function checkRadio(groupName, correctValue, nextId) {
        const selected = document.querySelector(`input[name="${groupName}"]:checked`);
        const currentBoxElement = document.querySelector('.question-box.active');

        if (selected && selected.value.toLowerCase() === correctValue) {
            saveProgress(currentBoxElement.id, selected.value);
            currentBoxElement.classList.remove('active');
            document.getElementById(nextId).classList.add('active');
            updateGlobalButton();
        }
    }

    function checkMath(inputId, correctValue, nextId) {
        const inputField = document.getElementById(inputId);
        const inputVal = inputField.value.trim();
        const currentBoxElement = document.querySelector('.question-box.active');

        if (inputVal === correctValue) {
            saveProgress(currentBoxElement.id, inputVal);
            currentBoxElement.classList.remove('active');
            document.getElementById(nextId).classList.add('active');
            updateGlobalButton();
        }
    }

    function checkNotEmpty(inputId, nextId) {
        const inputField = document.getElementById(inputId);
        const inputVal = inputField.value.trim();
        const currentBoxElement = document.querySelector('.question-box.active');

        if (inputVal !== "") {
            saveProgress(currentBoxElement.id, inputVal);
            currentBoxElement.classList.remove('active');
            document.getElementById(nextId).classList.add('active');
            updateGlobalButton();
        }
    }

    function nextStep(nextId) {
        const currentBoxElement = document.querySelector('.question-box.active');
        currentBoxElement.classList.remove('active');
        document.getElementById(nextId).classList.add('active');
        updateGlobalButton();
    }

    function checkGameSelection() {
        const selected = document.querySelector('input[name="game"]:checked');
        if (!selected) return;

        const currentBoxElement = document.querySelector('.question-box.active');
        saveProgress('q6', selected.value);

        if (selected.value.toLowerCase() === 'чикен ган') {
            currentBoxElement.classList.remove('active');
            document.getElementById('q7').classList.add('active');
            updateGlobalButton();
        } else {
            triggerWhiteFlash('q7');
        }
    }

    function triggerWhiteFlash(nextId) {
        const container = document.getElementById('mainContainer');
        const currentBoxElement = document.querySelector('.question-box.active');

        container.style.opacity = '0';

        setTimeout(() => {
            document.body.style.background = '#000000';
            setTimeout(() => {
                document.body.style.background = '#ffffff';
                setTimeout(() => {
                    document.body.style.background = '#1e1e2f';
                    currentBoxElement.classList.remove('active');
                    document.getElementById(nextId).classList.add('active');
                    container.style.opacity = '1';
                    updateGlobalButton();
                }, 500);
            }, 80);
        }, 200);
    }
</script>

</body>
</html>
