<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #12121a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box, .dashboard {
            background: #1e1e2f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .dashboard {
            display: none;
            max-width: 500px;
            text-align: left;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 6px;
            border: 1px solid #444466;
            background: #2a2a40;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 6px;
            border: none;
            background-color: #6c5ce7;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #5b4bc4;
        }
        /* Кнопка очистки */
        .clear-btn {
            background-color: #ff6b6b;
        }
        .clear-btn:hover {
            background-color: #ee5253;
        }
        .error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .status-item {
            background: #2a2a40;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 15px;
        }
        .status-item span {
            color: #a29bfe;
            font-weight: bold;
        }
        h2 { margin-top: 0; }
    </style>
</head>
<body>

    <!-- Окно ввода пароля -->
    <div class="login-box" id="loginBox">
        <h2>Вход в админку</h2>
        <input type="password" id="passwordInput" placeholder="Введите пароль...">
        <button onclick="checkPassword()">Войти</button>
        <div class="error" id="errorMsg">Неверный пароль!</div>
    </div>

    <!-- Панель наблюдения -->
    <div class="dashboard" id="dashboardBox">
        <h2>Панель наблюдения</h2>
        <div class="status-item">Текущий вопрос: <span id="currentQuestion">Ожидание...</span></div>
        <div class="status-item">Последние ответы пользователя:</div>
        <div id="answersList" style="max-height: 250px; overflow-y: auto;">
            <div style="color: #777; font-size: 14px;">Пока нет данных...</div>
        </div>
        <!-- Кнопка очистки -->
        <button class="clear-btn" onclick="clearSession()">Очистить сессию</button>
    </div>

<script>
    function checkPassword() {
        const pass = document.getElementById('passwordInput').value;
        if (pass === '1238') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboardBox').style.display = 'block';
            startListening();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    function startListening() {
        // Каждую секунду проверяем localStorage
        setInterval(() => {
            const currentQ = localStorage.getItem('admin_current_question') || 'Ожидание...';
            const answersData = JSON.parse(localStorage.getItem('admin_user_answers') || '{}');

            document.getElementById('currentQuestion').innerText = currentQ;

            const answersListContainer = document.getElementById('answersList');
            if (Object.keys(answersData).length > 0) {
                let html = '';
                for (let q in answersData) {
                    html += `<div style="background: #1e1e2f; padding: 8px; margin-top: 5px; border-radius: 4px; font-size: 13px;">
                        <b>${q}:</b> ${answersData[q]}
                    </div>`;
                }
                answersListContainer.innerHTML = html;
            } else {
                answersListContainer.innerHTML = '<div style="color: #777; font-size: 14px;">Пока нет данных...</div>';
            }
        }, 500);
    }

    function clearSession() {
        // Удаляем данные сессии из памяти браузера
        localStorage.removeItem('admin_current_question');
        localStorage.removeItem('admin_user_answers');
        
        // Сразу обновляем интерфейс админки
        document.getElementById('currentQuestion').innerText = 'Ожидание...';
        document.getElementById('answersList').innerHTML = '<div style="color: #777; font-size: 14px;">Пока нет данных...</div>';
    }
</script>

</body>
</html>
